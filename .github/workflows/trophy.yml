name: Update README Trophies

on:
  schedule:
    - cron: "0 */12 * * *" # Chạy mỗi 12 tiếng (2 lần/ngày)
  workflow_dispatch: # Cho phép kích hoạt thủ công từ giao diện GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update README Projects Table from GitHub API
        run: python update_readme_table.py

      - name: Commit & Push README changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --staged --quiet || (git commit -m "chore: auto-update README projects table from GitHub API" && git push origin main)

      - name: Create output directory
        run: mkdir -p output

      - name: Generate trophy card
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=loerei&theme=onedark&column=-1&row=1&margin-w=8&margin-h=8&no-bg=true&no-frame=false'
          path: output/trophies.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Trophies to separate branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: trophies
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'chore: update trophies'
